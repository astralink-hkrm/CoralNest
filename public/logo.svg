<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e"/>
      <stop offset="100%" stop-color="#0f223d"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#6b8e23"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#coralBg)" stroke="url(#coralGrad)" stroke-width="2.5"/>

  <!-- Exact Sketch Coral Nest Silhouette & Branch Outline -->
  <g fill="none" stroke="url(#coralGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#coralGlow)">
    <!-- Outer Contour Circle boundary of sketch -->
    <circle cx="50" cy="50" r="40" stroke-width="2" stroke-dasharray="80 12" opacity="0.6"/>

    <!-- Main Coral Trunk rising & branching -->
    <path d="M 44 80 C 44 68 36 62 48 48 C 54 41 52 30 50 20"/>
    
    <!-- Top Left Main Branch -->
    <path d="M 48 48 C 38 42 28 34 32 24 C 35 18 42 20 44 26 C 46 32 40 38 48 44"/>
    
    <!-- Upper Top Right Branch -->
    <path d="M 50 36 C 58 30 62 20 58 16 C 54 13 48 18 52 24"/>

    <!-- Far Left Outer Branch -->
    <path d="M 38 60 C 26 56 16 44 20 32 C 24 24 30 30 28 38 C 26 44 34 52 42 54"/>

    <!-- Bottom Left Loop Branch -->
    <path d="M 40 72 C 24 76 16 64 22 54 C 26 48 30 54 28 62"/>

    <!-- Far Right Outer Branch -->
    <path d="M 54 58 C 66 52 78 40 74 26 C 70 18 64 24 68 34 C 70 42 62 52 52 56"/>

    <!-- Bottom Right Loop Branch -->
    <path d="M 48 64 C 60 76 76 68 70 54 C 66 46 60 52 64 60"/>
  </g>

  <!-- Accent dots (sketch stippling effect) -->
  <circle cx="50" cy="20" r="2" fill="#10b981"/>
  <circle cx="32" cy="24" r="2" fill="#38bdf8"/>
  <circle cx="58" cy="16" r="2" fill="#34d399"/>
  <circle cx="20" cy="32" r="2" fill="#0284c7"/>
  <circle cx="74" cy="26" r="2" fill="#6b8e23"/>
</svg>
