<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f1e"/>
      <stop offset="100%" stop-color="#0f223d"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#6b8e23"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circle Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#coralBg)" stroke="url(#coralGrad)" stroke-width="2.5"/>

  <!-- Coral Structure matching exact reference image -->
  <g fill="none" stroke="url(#coralGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#coralGlow)">
    <!-- Base curved line -->
    <path d="M 26 82 Q 50 78 74 82" />

    <!-- Central stem rising from base -->
    <path d="M 48 79 C 48 68 46 56 42 46 C 40 38 44 26 48 18" />
    
    <!-- Top Center-Right Crown Branch -->
    <path d="M 42 46 C 45 36 50 28 58 20" />
    <path d="M 54 24 C 52 18 56 15 62 18" />

    <!-- Top Left Finger -->
    <path d="M 44 28 C 38 24 34 20 40 16 C 44 14 46 16 48 18" />
    
    <!-- Mid-High Left Branch -->
    <path d="M 42 46 C 32 44 26 36 28 28 C 30 22 36 24 34 30 C 32 36 38 40 44 42" />
    
    <!-- Mid-Low Left Branch -->
    <path d="M 46 58 C 34 56 22 52 24 44 C 26 38 32 40 30 46 C 28 52 38 56 46 58" />
    
    <!-- Bottom Left Branch -->
    <path d="M 47 68 C 36 68 24 64 26 56 C 28 52 34 54 32 60 C 30 64 40 68 47 68" />

    <!-- Mid-High Right Branch -->
    <path d="M 45 42 C 54 44 64 38 68 28 C 72 20 78 24 74 30 C 70 36 60 42 48 48" />
    <path d="M 66 32 C 72 30 76 34 72 38" />

    <!-- Mid-Low Right Branch -->
    <path d="M 46 54 C 58 54 68 48 76 42 C 80 38 84 42 80 46 C 74 52 62 58 47 62" />

    <!-- Bottom Right Branch -->
    <path d="M 48 66 C 58 66 70 64 74 56 C 76 50 82 52 78 58 C 72 64 60 68 48 70" />
  </g>
</svg>
