name: CoralNest CLI CI & Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coralnest-cli-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify CoralNest CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CoralNest CLI
        run: bun run --cwd packages/clawhub build

      - name: Verify CLI Executable Help Output
        run: |
          node packages/clawhub/bin/coralnest.js --help
          node packages/clawhub/bin/coralhub.js --help

      - name: Typecheck CLI package
        run: bunx tsc -p packages/clawhub/tsconfig.json --noEmit

      - name: Full App & CLI Typecheck Build Gate
        run: VITE_CONVEX_URL=https://example.invalid bun run ci:types-build
