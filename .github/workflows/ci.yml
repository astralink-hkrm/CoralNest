name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Static checks
        run: bun run ci:static

      - name: Unit coverage
        run: bun run ci:unit

      - name: Package checks
        run: bun run ci:packages

      - name: Typecheck & Production Build
        run: bun run ci:types-build

      - name: HTTP API E2E Verification
        run: bun run ci:e2e-http
